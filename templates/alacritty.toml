# {{ name }} — generated by plasma-themer
[colors.primary]
background = "{{ c.background }}"
foreground = "{{ c.foreground }}"
dim_foreground = "{{ c.dark_foreground }}"
bright_foreground = "{{ c.bright_foreground }}"

[colors.cursor]
text = "{{ c.background }}"
cursor = "{{ c.accent }}"

[colors.vi_mode_cursor]
text = "{{ c.background }}"
cursor = "{{ c.bright_foreground }}"

[colors.search.matches]
foreground = "{{ c.background }}"
background = "{{ c.yellow }}"

[colors.search.focused_match]
foreground = "{{ c.background }}"
background = "{{ c.red }}"

[colors.footer_bar]
foreground = "{{ c.background }}"
background = "{{ c.accent }}"

[colors.hints.start]
foreground = "{{ c.background }}"
background = "{{ c.yellow }}"

[colors.hints.end]
foreground = "{{ c.background }}"
background = "{{ c.accent }}"

[colors.selection]
text = "{{ c.selection_foreground }}"
background = "{{ c.selection_background }}"

[colors.normal]
black = "{{ c.ansi[0] }}"
red = "{{ c.ansi[1] }}"
green = "{{ c.ansi[2] }}"
yellow = "{{ c.ansi[3] }}"
blue = "{{ c.ansi[4] }}"
magenta = "{{ c.ansi[5] }}"
cyan = "{{ c.ansi[6] }}"
white = "{{ c.ansi[7] }}"

[colors.bright]
black = "{{ c.ansi[8] }}"
red = "{{ c.ansi[9] }}"
green = "{{ c.ansi[10] }}"
yellow = "{{ c.ansi[11] }}"
blue = "{{ c.ansi[12] }}"
magenta = "{{ c.ansi[13] }}"
cyan = "{{ c.ansi[14] }}"
white = "{{ c.ansi[15] }}"
