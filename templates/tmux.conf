# {{ name }} — generated by plasma-themer (sourced from ~/.tmux.conf)
set -g status-style "bg={{ c.darker_background }},fg={{ c.foreground }}"
set -g status-left "#[bg={{ c.accent }},fg={{ c.accent_foreground }},bold] #S #[default] "
set -g status-right "#[fg={{ c.dark_foreground }}]%H:%M #[bg={{ c.surface2 }},fg={{ c.foreground }}] #h "
set -g window-status-format "#[fg={{ c.dark_foreground }}] #I:#W "
set -g window-status-current-format "#[bg={{ c.surface2 }},fg={{ c.accent }},bold] #I:#W "
set -g pane-border-style "fg={{ c.border }}"
set -g pane-active-border-style "fg={{ c.accent }}"
set -g message-style "bg={{ c.surface2 }},fg={{ c.accent }}"
set -g mode-style "bg={{ c.selection }},fg={{ c.bright_foreground }}"
set -g clock-mode-colour "{{ c.accent }}"
